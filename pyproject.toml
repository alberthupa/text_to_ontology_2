[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "text-to-ontology"
version = "0.2.0"
description = "Dead simple text to ontology: add knowledge from text files to one Turtle graph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyshacl>=0.30,<1",
    "rdflib>=7,<8",
]

[project.scripts]
text-to-ontology = "text_to_ontology.cli:main"

# Development/test dependencies: none beyond the runtime requirements today.
# When one is needed, add a PEP 735 dependency group here, for example:
# [dependency-groups]
# dev = ["..."]

[tool.hatch.build.targets.wheel]
packages = ["src/text_to_ontology"]

[tool.hatch.build.targets.sdist]
include = [
    "src/text_to_ontology",
    "tests",
    "README.md",
]
